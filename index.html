<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyber Break</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05050a;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .hud span {
      color: #ff007f;
      font-size: 1.2rem;
    }
    canvas {
      background: radial-gradient(circle at center, #0a0a16 0%, #020205 100%);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(255, 0, 127, 0.1);
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4 / 3;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      top: 70px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(5, 5, 10, 0.85);
      border: 1px solid #ff007f;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 2.5rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff007f;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .overlay p {
      color: #e0e0e0;
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .btn {
      background: transparent;
      color: #ff007f;
      border: 2px solid #ff007f;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
      transition: all 0.2s ease-in-out;
    }
    .btn:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
      transform: scale(1.05);
    }
    .hidden {
      display: none !important;
    }
    .instructions {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #707090;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <div>Score: <span id="scoreDisplay">0</span></div>
      <div>Cyber Break</div>
      <div>Lives: <span id="livesDisplay">3</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <div id="startScreen" class="overlay">
      <h1>CYBER BREAK</h1>
      <p>Break the firewall matrix! Drag mouse/touch or use Arrow Keys to move.</p>
      <button class="btn" onclick="startGame()">Initiate Run</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 id="overTitle">SYSTEM FAILURE</h1>
      <p id="overText">Final Score: 0</p>
      <button class="btn" onclick="startGame()">Reboot System</button>
    </div>

    <div class="instructions">Controls: Mouse / Touch / Left & Right Arrow Keys</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const overTitle = document.getElementById('overTitle');
    const overText = document.getElementById('overText');

    // Game Variables
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let animationId;

    // Paddle Setup
    const paddle = {
      width: 90,
      height: 12,
      x: (canvas.width - 90) / 2,
      y: canvas.height - 25,
      dx: 7,
      isMovingLeft: false,
      isMovingRight: false
    };

    // Ball Setup
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 40,
      radius: 7,
      speed: 5,
      dx: 4,
      dy: -4
    };

    // Bricks Grid Setup
    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 72;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 15;
    let bricks = [];

    const colors = ['#ff007f', '#00f0ff', '#7928ca', '#00ff66', '#ffb703'];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r % colors.length] };
        }
      }
    }

    function drawPaddle() {
      ctx.fillStyle = '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f0ff';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.shadowBlur = 0; // reset
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff007f';
      ctx.fill();
      ctx.closePath();
      ctx.shadowBlur = 0;
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status === 1) {
            let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            b.x = brickX;
            b.y = brickY;
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
            ctx.shadowBlur = 0;
          }
        }
      }
    }

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10;
              scoreDisplay.innerText = score;
            }
          }
        }
      }

      if (activeBricks === 0) {
        endGame(true);
      }
    }

    function update() {
      if (!gameRunning) return;

      // Move Paddle
      if (paddle.isMovingRight && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.dx;
      } else if (paddle.isMovingLeft && paddle.x > 0) {
        paddle.x -= paddle.dx;
      }

      // Move Ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall Bounce (Left / Right)
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx = -ball.dx;
      }

      // Top Bounce
      if (ball.y - ball.radius < 0) {
        ball.dy = -ball.dy;
      }

      // Paddle Collision
      if (
        ball.y + ball.radius >= paddle.y &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        // Adjust bounce angle depending on where ball hits paddle
        let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        ball.dx = hitPoint * 5;
        ball.dy = -Math.abs(ball.dy);
      }

      // Bottom Wall (Lose Life)
      if (ball.y + ball.radius > canvas.height) {
        lives--;
        livesDisplay.innerText = lives;
        if (lives <= 0) {
          endGame(false);
        } else {
          resetBallAndPaddle();
        }
      }

      collisionDetection();
    }

    function resetBallAndPaddle() {
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 40;
      ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -4;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function startGame() {
      score = 0;
      lives = 3;
      scoreDisplay.innerText = score;
      livesDisplay.innerText = lives;
      initBricks();
      resetBallAndPaddle();
      gameRunning = true;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      cancelAnimationFrame(animationId);
      gameLoop();
    }

    function endGame(isWin) {
      gameRunning = false;
      cancelAnimationFrame(animationId);

      if (isWin) {
        overTitle.innerText = "FIREWALL CLEARED";
        overText.innerText = `Victory! Final Score: ${score}`;
      } else {
        overTitle.innerText = "SYSTEM FAILURE";
        overText.innerText = `Score: ${score}`;
      }
      gameOverScreen.classList.remove('hidden');
    }

    // Input Controllers
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') paddle.isMovingRight = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') paddle.isMovingLeft = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') paddle.isMovingRight = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') paddle.isMovingLeft = false;
    });

    // Touch & Pointer Controls
    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const relativeX = clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.width / 2;
      }
    }

    canvas.addEventListener('mousemove', handlePointer);
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });
  </script>
</body>
</html>
